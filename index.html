<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Script Snake</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+SC:wght@500;700&family=Noto+Sans+Devanagari:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#1C2541; --indigo-2:#243055; --grid:#2A3660;
    --washi:#F1EDE3; --mist:#8A93AD;
    --jade:#9AD1B2; --jade-bright:#D7F0E0;
    --shu:#E63B2E; --shu-soft:#F4A79F; --gold:#E8C46A;
    --glyph:'Zen Kaku Gothic New','Noto Sans SC','Noto Sans Devanagari','Hiragino Sans','PingFang SC','Kohinoor Devanagari','Devanagari Sangam MN','Noto Sans JP','Segoe UI',sans-serif;
    --disp:'Zen Old Mincho','Hiragino Mincho ProN',serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--indigo);color:var(--washi);font-family:var(--mono);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px))}
  .scr{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px}
  .ov{position:fixed;inset:0;z-index:10;background:rgba(28,37,65,.86);backdrop-filter:blur(3px);display:grid;place-items:center;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
  .ov[hidden]{display:none}
  .menu-card{width:min(92vw,340px);display:flex;flex-direction:column;gap:10px;background:var(--indigo-2);border:1px solid var(--grid);border-radius:14px;padding:18px 16px}
  h1{margin:0 0 2px;font:700 24px/1 var(--disp);letter-spacing:.02em;text-align:center}
  h1 span{color:var(--jade);font-family:var(--glyph);font-weight:500;margin-left:8px;font-size:22px}
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .chip{background:var(--indigo);border:2px solid transparent;border-radius:10px;padding:12px 6px;color:var(--washi);cursor:pointer;text-align:center;font-family:var(--glyph)}
  .chip b{display:block;font-size:17px;font-weight:500}
  .chip span{font:400 11px var(--mono);color:var(--mist)}
  .chip.on{border-color:var(--jade)}
  .pills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .pill{background:transparent;border:1px solid var(--grid);border-radius:20px;color:var(--mist);font:500 12px var(--mono);padding:5px 12px;cursor:pointer}
  .pill.on{background:var(--indigo);color:var(--washi);border-color:var(--indigo)}
  .pill.mode.on{border-color:var(--gold);color:var(--gold)}
  .modeBlurb{min-height:14px;text-align:center;font-size:11px;color:var(--mist)}
  .result{min-height:16px;text-align:center;font-size:12px;color:var(--mist)}
  .primary{background:var(--jade);color:var(--indigo);border:0;border-radius:10px;padding:13px;font:500 15px var(--mono);cursor:pointer}
  .ghost{background:transparent;border:1px solid var(--grid);border-radius:10px;color:var(--jade);padding:10px;font:500 13px var(--mono);cursor:pointer}
  .ghost.sm{border:0;padding:4px 10px;color:var(--mist);font-size:12px}
  .hint{margin:2px 0 0;text-align:center;font-size:11px;color:var(--mist);line-height:1.5}
  .row{display:flex;align-items:center;justify-content:space-between}
  .score{font-size:13px;color:var(--mist);text-align:right}
  .score b{font:700 20px var(--disp);color:var(--washi)}
  .mult{display:block;font-size:11px;color:var(--mist)}
  .mult.hot{color:var(--gold)}
  .under{display:flex;justify-content:center;gap:14px}
  .setgrp{display:flex;flex-direction:column;gap:8px;margin-top:14px;border-top:0.5px solid var(--grid);padding-top:12px;font-size:12px;color:var(--mist)}
  .setgrp label{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .setgrp select{max-width:200px}
  select{background:var(--indigo-2);color:var(--washi);border:1px solid var(--grid);border-radius:4px;font:500 11px var(--mono);padding:4px 6px}
  .seal{width:52px;height:52px;overflow:hidden;border:3px solid var(--shu);border-radius:6px;display:grid;place-items:center;color:var(--shu);font:700 17px/1 var(--disp);letter-spacing:.02em;position:relative;cursor:pointer;user-select:none;transition:transform .08s}
  .seal:active{transform:scale(.96)}
  .seal.pulse{animation:pulse .6s ease-out}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(230,59,46,.55)}100%{box-shadow:0 0 0 18px rgba(230,59,46,0)}}
  .seal small{position:absolute;bottom:2px;font:400 8px var(--mono);letter-spacing:.1em;color:var(--shu-soft)}
  .seal.hidden-cue{font-size:24px}
  canvas{width:100%;max-width:520px;aspect-ratio:1;background:var(--indigo);border:1px solid var(--grid);border-radius:8px;touch-action:none;display:block;box-shadow:0 18px 40px -20px rgba(0,0,0,.7)}
  .pad{display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,52px);gap:6px;margin:0 auto}
  .pad button{background:var(--indigo-2);border:1px solid var(--grid);border-radius:6px;color:var(--washi);font-size:20px}
  .pad button:nth-child(1){grid-column:2}
  .pad button:nth-child(2){grid-column:1;grid-row:2}
  .pad button:nth-child(3){grid-column:2;grid-row:2}
  .pad button:nth-child(4){grid-column:3;grid-row:2}
  @media (pointer:coarse){.pad{display:grid}}
  kbd{border:1px solid var(--grid);border-radius:3px;padding:0 4px;font-family:inherit}
  .btn{background:transparent;border:1px solid var(--jade);border-radius:4px;color:var(--jade);font:500 12px var(--mono);padding:6px 10px;cursor:pointer}
  .learn{position:fixed;inset:0;z-index:20;display:none;background:rgba(28,37,65,.92);backdrop-filter:blur(3px);overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(40px + env(safe-area-inset-bottom,0px))}
  .learn.show{display:block}
  .learn .inner{max-width:520px;margin:0 auto}
  .learn .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .learn h2{margin:0;font:700 22px var(--disp)}
  .learn .sub{font-size:11px;color:var(--mist);margin-top:4px}
  .chart{display:grid;grid-template-columns:repeat(var(--cols,5),1fr);gap:8px}
  .tile{min-width:0;background:var(--washi);color:#1A2138;border-radius:6px;padding:10px 4px 7px;text-align:center;cursor:pointer;border:2px solid transparent;position:relative;user-select:none;transition:transform .08s}
  .tile:active{transform:scale(.95)}
  .tile b{display:block;font:700 clamp(18px,6.5vw,30px)/1.25 var(--glyph);overflow:visible}
  .tile i{display:block;font:400 11px var(--mono);color:#4a5170;margin-top:4px;font-style:normal}
  .tile.weak{border-color:var(--shu)}
  .tile.weak em{position:absolute;top:-8px;right:-6px;background:var(--shu);color:#fff;font:500 10px var(--mono);font-style:normal;border-radius:10px;padding:1px 6px}
  .tile.mastered{border-color:var(--jade)}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--mist);margin:12px 0 0}
  .over-card{width:min(92vw,340px);display:flex;flex-direction:column;gap:10px;background:var(--indigo-2);border:1px solid var(--grid);border-radius:14px;padding:20px 16px;text-align:center}
  .over-card h2{margin:0;font:700 22px var(--disp)}
  .overScore{font:700 44px/1 var(--disp)}
  .overRecord{min-height:16px;font-size:12px;color:var(--gold)}
  .overDetail{font-size:12px;color:var(--mist)}
  .missRow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:4px}
  .missRow[hidden]{display:none}
  .missLabel{font-size:11px;color:var(--mist)}
  .missChip{background:var(--washi);color:#1A2138;border:1px solid var(--shu);border-radius:6px;padding:4px 8px;cursor:pointer;font:500 14px var(--glyph)}
  .missChip i{font:400 10px var(--mono);color:#4a5170;font-style:normal;margin-left:3px}
</style>
</head>
<body>

<div class="ov" id="menuScr"><div class="menu-card">
  <h1>Script Snake<span id="snakeWord">へび</span></h1>
  <div class="chips" id="langGrid"></div>
  <div class="pills" id="setRow"></div>
  <div class="pills" id="modeRow"></div>
  <div class="modeBlurb" id="modeBlurb"></div>
  <div class="result" id="resultLine"></div>
  <button class="primary" id="playBtn">Play</button>
  <button class="ghost" id="menuLearnBtn">Learn the characters</button>
  <p class="hint">swipe or arrows to steer · eat the character you hear · wrong bites cost a segment<br>answer fast for bonus points · <kbd>space</kbd> replays the sound</p>
</div></div>

<div class="scr" id="playScr" hidden>
  <div class="row">
    <div class="seal" id="seal"><span id="cueText">—</span><small>▶</small></div>
    <div class="score">
      <b id="score">0</b><span> · streak <b id="streak">0</b></span>
      <span class="mult" id="mult"></span>
    </div>
  </div>
  <canvas id="c" aria-label="Game board"></canvas>
  <div class="under">
    <button class="ghost sm" id="pauseBtn">‖ pause</button>
    <button class="ghost sm" id="quitBtn">menu</button>
  </div>
  <div class="pad" aria-label="Direction pad">
    <button data-dir="up" aria-label="Up">↑</button><button data-dir="left" aria-label="Left">←</button><button data-dir="down" aria-label="Down">↓</button><button data-dir="right" aria-label="Right">→</button>
  </div>
</div>

<div class="ov" id="overScr" hidden><div class="over-card">
  <h2>run over</h2>
  <div class="overScore" id="overScore">0</div>
  <div class="overRecord" id="overRecord"></div>
  <div class="overDetail" id="overDetail"></div>
  <div class="missRow" id="overMissed" hidden></div>
  <button class="primary" id="againBtn">Again</button>
  <button class="ghost" id="overMenuBtn">menu</button>
</div></div>

<div class="learn" id="learn" role="dialog" aria-label="Character chart">
  <div class="inner">
    <div class="top">
      <div><h2 id="learnTitle">chart</h2><div class="sub">tap to hear · game paused</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="sortBtn">weakest first</button><button class="btn" id="resetBtn">reset progress</button><button class="btn" id="learnClose">back</button></div>
    </div>
    <div class="chart" id="chart"></div>
    <div class="legend">red border = missed · green = solid</div>
    <div class="setgrp">
      <label>voice <select id="voiceSel" aria-label="Voice"></select></label>
      <label><input type="checkbox" id="showSnd"> show the sound during play</label>
      <label><input type="checkbox" id="reduceMotion"> reduce motion (no shake or particles)</label>
    </div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
